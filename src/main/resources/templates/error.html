<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Minidooray</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .error-container { background-color: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 500px; width: 90%; }
        h1 { color: #212529; margin: 1rem 0; font-size: 1.5rem; }
        .status-code { font-size: 5rem; font-weight: 800; color: #dc3545; margin: 0; line-height: 1; }
        .error-details { text-align: left; background-color: #f8f9fa; padding: 1.2rem; border-radius: 8px; margin: 2rem 0; border: 1px solid #dee2e6; }
        .error-details p { margin: 0.6rem 0; font-size: 0.95rem; color: #495057; line-height: 1.4; word-break: break-all; }
        .error-details strong { color: #212529; display: inline-block; width: 80px; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background-color: #0d6efd; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background-color: #0b5ed7; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="error-container">
    <div class="status-code" th:text="${error.status}">500</div>
    <h1>문제가 발생했습니다.</h1>
    
    <div class="error-details">
        <p><strong>메시지:</strong> <span th:text="${error.message}">에러 상세 내용이 여기에 표시됩니다.</span></p>
        <p><strong>경로:</strong> <span th:text="${error.path}">/requested/path</span></p>
    </div>

    <div style="display: flex; gap: 10px; justify-content: center;">
        <button onclick="history.back()" class="btn" style="background-color: #6c757d;">이전 페이지로 돌아가기</button>
        <a href="/" class="btn">홈으로 돌아가기</a>
    </div>
</div>

</body>
</html>
