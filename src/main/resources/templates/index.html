<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>대시보드 - Minidooray</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7f9; min-height: 100vh; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #1a1c23; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; transition: all 0.3s; z-index: 1000; }
        .sidebar-brand { padding: 30px; font-size: 1.5rem; font-weight: 700; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-menu { padding: 20px 0; flex-grow: 1; }
        .menu-item { padding: 12px 30px; display: flex; align-items: center; color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.2s; border-left: 4px solid transparent; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.05); color: #fff; border-left-color: #667eea; }
        .menu-icon { margin-right: 15px; font-size: 1.2rem; }
        
        /* Main Content */
        .main-wrapper { flex-grow: 1; margin-left: 280px; width: calc(100% - 280px); }
        .top-navbar { height: 70px; background: white; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; padding: 0 40px; position: sticky; top: 0; z-index: 900; }
        .content-area { padding: 40px; }
        
        /* Cards */
        .project-card { border: none; border-radius: 20px; background: white; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .project-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        .card-body { padding: 30px; }
        .status-badge { font-size: 0.7rem; font-weight: 700; padding: 6px 12px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-add { background: #667eea; color: white; border-radius: 12px; padding: 10px 24px; font-weight: 600; border: none; transition: 0.2s; }
        .btn-add:hover { background: #5a6fd6; transform: scale(1.02); }
        
        .empty-illustration { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/my-projects" class="sidebar-brand">Minidooray</a>
        <nav class="sidebar-menu">
            <a href="/my-projects" class="menu-item active">
                <span class="menu-icon">📊</span> 대시보드
            </a>
            <a href="#" class="menu-item">
                <span class="menu-icon">⚙️</span> 설정
            </a>
        </nav>
        <div class="mt-auto p-4 border-top border-secondary border-opacity-25">
            <div class="small text-secondary mb-3" th:text="${#authentication.name}">User</div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm w-100 rounded-pill">로그아웃</button>
            </form>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <nav class="top-navbar">
            <h4 class="fw-bold mb-0">전체 프로젝트</h4>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 text-muted small" th:text="${#authentication.name} + '님, 환영합니다!'">User</span>
                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">👤</div>
            </div>
        </nav>

        <main class="content-area">
            <!-- Error Alert Banner -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
                <strong>알림:</strong> <span th:text="${errorMessage}">에러 메시지</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="display-6 fw-bold mb-1">내 프로젝트</h2>
                    <p class="text-muted">참여 중인 모든 협업 공간을 한눈에 관리하세요.</p>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <div class="btn-group shadow-sm" role="group">
                        <a href="/my-projects?status=ALL" th:class="|btn btn-sm ${currentStatus == 'ALL' ? 'btn-dark' : 'btn-outline-dark'}|">ALL</a>
                        <a href="/my-projects?status=ACTIVE" th:class="|btn btn-sm ${currentStatus == 'ACTIVE' ? 'btn-success' : 'btn-outline-success'}|">ACTIVE</a>
                        <a href="/my-projects?status=DORMANT" th:class="|btn btn-sm ${currentStatus == 'DORMANT' ? 'btn-warning' : 'btn-outline-warning'}|">DORMANT</a>
                        <a href="/my-projects?status=TERMINATED" th:class="|btn btn-sm ${currentStatus == 'TERMINATED' ? 'btn-secondary' : 'btn-outline-secondary'}|">TERMINATED</a>
                    </div>
                    <button type="button" class="btn-add" data-bs-toggle="modal" data-bs-target="#projectModal">
                        + 새 프로젝트 생성
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${projects.empty}" class="text-center py-5 bg-white rounded-5 shadow-sm border border-dashed">
                <div class="empty-illustration">📁</div>
                <h4 class="fw-bold text-dark">참여 중인 프로젝트가 없습니다.</h4>
                <p class="text-muted mb-4">첫 번째 프로젝트를 생성하여 팀원들과 협업을 시작해 보세요!</p>
                <button class="btn btn-primary px-5 py-3 rounded-pill fw-bold" data-bs-toggle="modal" data-bs-target="#projectModal">지금 프로젝트 만들기</button>
            </div>

            <!-- Project Grid (Full Width) -->
            <div class="row row-cols-1 row-cols-xl-3 row-cols-xxl-4 g-4">
                <div th:each="project : ${projects}" class="col">
                    <div class="card project-card">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-4">
                                <span th:class="|badge status-badge ${project.status == 'ACTIVE' ? 'bg-success-subtle text-success' : (project.status == 'DORMANT' ? 'bg-warning-subtle text-warning' : 'bg-secondary-subtle text-secondary')}|"
                                      th:text="${project.status}">ACTIVE</span>
                                <div class="dropdown">
                                    <button class="btn btn-link text-muted p-0" type="button" data-bs-toggle="dropdown">⋮</button>
                                </div>
                            </div>
                            <h4 class="card-title fw-bold mb-3 text-truncate" th:text="${project.name}">Project Name</h4>
                            <p class="small text-muted flex-grow-1">팀원들과 효율적으로 태스크를 관리하고 목표를 달성하세요.</p>
                            <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                                <div class="avatar-group d-flex">
                                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center border border-white" style="width: 32px; height: 32px; font-size: 10px;">A</div>
                                </div>
                                <a th:href="@{/projects/{id}(id=${project.projectId})}" class="text-decoration-none fw-bold small text-primary">자세히 보기 →</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="modal-title fw-bold fs-4">새 프로젝트 생성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/projects}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-bold text-muted">프로젝트 이름</label>
                            <input type="text" class="form-control form-control-lg bg-light border-0 shadow-none" id="name" name="name" placeholder="예: 미니두레이 개발 팀" required style="border-radius: 12px;">
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0">
                        <button type="button" class="btn btn-light px-4 py-2 rounded-pill fw-bold" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill fw-bold">생성하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
