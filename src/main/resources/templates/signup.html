<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 - Minidooray</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .signup-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); }
        .signup-header { background: linear-gradient(135deg, #42b72a 0%, #2da44e 100%); color: white; border-radius: 1rem 1rem 0 0 !important; padding: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card signup-card">
                    <div class="card-header signup-header text-center">
                        <h3 class="fw-bold mb-0">회원가입</h3>
                        <p class="small mb-0">새로운 여정을 시작해보세요!</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/signup}" th:object="${request}" method="post">
                            <div class="mb-3">
                                <label for="id" class="form-label small fw-bold">아이디</label>
                                <input type="text" class="form-control" id="id" th:field="*{id}" placeholder="사용할 아이디를 입력하세요" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-bold">이메일</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="이메일 주소를 입력하세요" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold">비밀번호</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">가입하기</button>
                        </form>
                        
                        <div class="text-center small">
                            이미 계정이 있으신가요? <a th:href="@{/login}" class="text-decoration-none fw-bold">로그인</a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="/" class="text-muted text-decoration-none small">← 메인 페이지로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
