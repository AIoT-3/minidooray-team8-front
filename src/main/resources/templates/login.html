<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - Minidooray</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); }
        .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 1rem 1rem 0 0 !important; padding: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-header login-header text-center">
                        <h3 class="fw-bold mb-0">Minidooray</h3>
                        <p class="small mb-0">환영합니다! 계속하려면 로그인하세요.</p>
                    </div>
                    <div class="card-body p-4">
                        <!-- 에러 메시지 -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center" role="alert">
                            아이디 또는 비밀번호가 올바르지 않습니다.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold">아이디</label>
                                <input type="text" class="form-control" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold">비밀번호</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">로그인</button>
                        </form>
                        
                        <div class="text-center small">
                            계정이 없으신가요? <a th:href="@{/signup}" class="text-decoration-none fw-bold">회원가입</a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="/" class="text-muted text-decoration-none small">← 메인 페이지로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
