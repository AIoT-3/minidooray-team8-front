<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - Minidooray</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f4f7f9; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(135deg, #f4f7f9 0%, #e9ecef 100%);
        }
        .login-card { 
            border: none; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); 
            overflow: hidden;
            background: white;
            width: 100%;
            max-width: 450px;
        }
        .login-header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 3rem 2rem; 
            text-align: center;
        }
        .login-body { padding: 3rem; }
        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            border: 1px solid #e1e8ed;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        .form-control:focus {
            background-color: white;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .btn-login {
            background: #1a1c23;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #2d303a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            color: white;
        }
        .signup-link { color: #667eea; font-weight: 700; text-decoration: none; }
        .signup-link:hover { text-decoration: underline; }
        
        .alert-custom {
            border-radius: 12px;
            border: none;
            background-color: #fff5f5;
            color: #e53e3e;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center py-5">
        <div class="login-card animate__animated animate__fadeInUp">
            <div class="login-header">
                <a href="/" class="text-white text-decoration-none d-inline-block mb-3">
                    <h2 class="fw-800 mb-0" style="letter-spacing: -1px;">Minidooray</h2>
                </a>
                <p class="mb-0 opacity-75">스마트한 협업의 시작, 로그인하세요.</p>
            </div>
            
            <div class="login-body">
                <!-- Error Message from Spring Security -->
                <div th:if="${param.error}" class="alert alert-custom p-3 mb-4 text-center" role="alert">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <!-- Global Error Alert Banner (Custom logic) -->
                <div th:if="${errorMessage}" class="alert alert-custom p-3 mb-4 text-center" role="alert">
                    <span th:text="${errorMessage}">에러 메시지</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="userId" class="form-label small fw-bold text-muted text-uppercase">ID</label>
                        <input type="text" class="form-control" id="userId" name="userId" placeholder="Your User ID" required autofocus>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label small fw-bold text-muted text-uppercase">Password</label>
                            <a href="#" class="small text-muted text-decoration-none mb-2">Forgot?</a>
                        </div>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label small text-muted" for="remember">ID 기억하기</label>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>
                
                <div class="text-center mt-5">
                    <p class="text-muted small">아직 계정이 없으신가요? <a th:href="@{/signup}" class="signup-link ms-1">회원가입</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
